name: CI

# Commits that only touch prose (README, BACKLOG, LICENSE, ...) or OpenSpec
# planning files (openspec/, .claude/) don't run CI, nor the benchmark code (bench/), which
# runs on chosen machines, never on CI. CI only renders the benchmark pages from the
# committed results, so changes to those re-run it. docs/ does, to rebuild the dev log.
# paths-ignore cannot re-include a path, so this uses paths with negations: the last
# pattern that matches a file wins.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
      - "!openspec/**"
      - "!.claude/**"
      - "!tools/specview.nim"
      - "!.github/workflows/openspec.yml"
      - "!bench/**"
      # the benchmark pages are rendered for the site from committed results
      - "bench/results/**"
      - "bench/scenarios/**"
      - "bench/results.nim"
      - "bench/design.nim"
      - "bench/scenarios_page.nim"
      - "bench/scenario.nim"
      - "bench/DESIGN.md"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
      - "!openspec/**"
      - "!.claude/**"
      - "!tools/specview.nim"
      - "!.github/workflows/openspec.yml"
      - "!bench/**"
      # the benchmark pages are rendered for the site from committed results
      - "bench/results/**"
      - "bench/scenarios/**"
      - "bench/results.nim"
      - "bench/design.nim"
      - "bench/scenarios_page.nim"
      - "bench/scenario.nim"
      - "bench/DESIGN.md"
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIM_BRANCH: version-2-4

jobs:
  # Nim 2.4 is built from source: the 2.4.0 release binaries lack nifler, which
  # `nim ic` needs. The build (a few minutes) is cached by the branch's commit.
  docs:
    runs-on: ubuntu-24.04  # still ships libpcre3, which nimib's markdown renderer needs
    timeout-minutes: 30  # a cold Nim build takes about 7
    steps:
      - uses: actions/checkout@v4
      # actions/cache rejects paths with `..`, so Nim lives in the home directory
      - run: echo "NIM_DIR=$HOME/nim" >> "$GITHUB_ENV"
      - id: nim-sha
        run: echo "sha=$(git ls-remote https://github.com/nim-lang/Nim refs/heads/$NIM_BRANCH | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: nim-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NIM_DIR }}
          key: nim-${{ runner.os }}-${{ runner.arch }}-${{ steps.nim-sha.outputs.sha }}
      - name: Build Nim, nifler, nifmake and atlas
        if: steps.nim-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$NIM_BRANCH" https://github.com/nim-lang/Nim "$NIM_DIR"
          cd "$NIM_DIR"
          . config/build_config.txt
          git clone -q "$nim_csourcesUrl" "$nim_csourcesDir"
          git -C "$nim_csourcesDir" checkout -q "$nim_csourcesHash"
          make -C "$nim_csourcesDir" -j"$(nproc)"
          ./bin/nim c --hints:off --skipUserCfg --skipParentCfg koch
          ./koch boot -d:release --skipUserCfg --skipParentCfg
          ./koch atlas --skipUserCfg --skipParentCfg
          rm -rf "$nim_csourcesDir"
      - run: echo "$NIM_DIR/bin" >> "$GITHUB_PATH"
      - run: nim -v && ls "$NIM_DIR/bin"
      # usually preinstalled on the image; apt-get only runs when it isn't
      - run: dpkg -s libpcre3 > /dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libpcre3)
      - run: atlas install
      # renders the posts in docs/blog (running the experiments), then the index
      - name: Render the dev log
        timeout-minutes: 10
        run: nim docs
      # from the committed results in bench/results: nothing is benchmarked here
      - name: Render the benchmark pages
        timeout-minutes: 10
        run: |
          nim r --hints:off bench/results.nim
          nim r --hints:off bench/design.nim
          nim r --hints:off bench/scenarios_page.nim
      - name: Assemble site
        run: |
          mkdir -p _site/blog _site/bench
          cp docs/blog/*.html _site/blog/
          cp -r docs/blog/*/ _site/blog/  # a post's images (blog/<folder>/)
          cp docs/index.html _site/index.html
          cp -r docs/assets _site/assets
          cp bench/results.html bench/design.html bench/scenarios.html _site/bench/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
