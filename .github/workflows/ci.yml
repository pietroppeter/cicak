name: CI

# Commits that only touch prose (README, BACKLOG, LICENSE, ...) or OpenSpec
# planning files (openspec/, .claude/) don't run CI, nor the benchmark code (bench/), which
# runs on chosen machines, never on CI. CI only renders the benchmark pages from the
# committed results, so changes to those re-run it. docs/ does, to rebuild the dev log.
# paths-ignore cannot re-include a path, so this uses paths with negations: the last
# pattern that matches a file wins.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
      - "!openspec/**"
      - "!.claude/**"
      - "!tools/specview.nim"
      - "!.github/workflows/openspec.yml"
      - "!bench/**"
      # the benchmark pages are rendered for the site from committed results
      - "bench/results/**"
      - "bench/scenarios/**"
      - "bench/results.nim"
      - "bench/design.nim"
      - "bench/scenarios_page.nim"
      - "bench/scenario.nim"
      - "bench/DESIGN.md"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
      - "!openspec/**"
      - "!.claude/**"
      - "!tools/specview.nim"
      - "!.github/workflows/openspec.yml"
      - "!bench/**"
      # the benchmark pages are rendered for the site from committed results
      - "bench/results/**"
      - "bench/scenarios/**"
      - "bench/results.nim"
      - "bench/design.nim"
      - "bench/scenarios_page.nim"
      - "bench/scenario.nim"
      - "bench/DESIGN.md"
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIM_VERSION: 2.4.0

jobs:
  # Nim 2.4 from the official linux_x64 tarball, the same as the cloud sessions
  # (tools/cloud-setup.sh): since its 2026-10-28 rebuild it ships nifler and nifmake,
  # which `nim ic` needs, so there is no Nim build from source (it took about 7 min,
  # every time the version-2-4 branch moved). The tarball is cached by its sha256.
  docs:
    runs-on: ubuntu-24.04  # still ships libpcre3, which nimib's markdown renderer needs
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # actions/cache rejects paths with `..`, so Nim lives in the home directory
      - id: nim-sha
        run: |
          echo "NIM_DIR=$HOME/nim" >> "$GITHUB_ENV"
          url="https://nim-lang.org/download/nim-$NIM_VERSION-linux_x64.tar.xz"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$(curl -fsSL --retry 3 "$url.sha256" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: nim-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NIM_DIR }}
          key: nim-tarball-${{ runner.os }}-${{ runner.arch }}-${{ steps.nim-sha.outputs.sha }}
      - name: Install Nim, nifler, nifmake and atlas
        if: steps.nim-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nim.tar.xz" "${{ steps.nim-sha.outputs.url }}"
          echo "${{ steps.nim-sha.outputs.sha }}  $RUNNER_TEMP/nim.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/nim.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/nim-$NIM_VERSION" "$NIM_DIR"
          for tool in nim nifler nifmake atlas; do test -x "$NIM_DIR/bin/$tool"; done
      - run: echo "$NIM_DIR/bin" >> "$GITHUB_PATH"
      # libpcre3 for nimib's markdown renderer, musl for the tarball's nifler and
      # nifmake (nim and atlas are static); apt-get only runs when one is missing
      - run: dpkg -s libpcre3 musl > /dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq libpcre3 musl)
      - run: nim -v && nifler --version
      - run: atlas install
      # The posts in docs/blog (running the experiments), the index and the benchmark
      # pages (from the committed results in bench/results: nothing is benchmarked
      # here), in one program: docs/all.nim. Nim's own cache (~/.cache/nim) is not
      # kept between runs on purpose: the experiments time cold `nim ic` builds.
      - name: Render the site
        timeout-minutes: 10
        run: nim docs
      - name: Assemble site
        run: |
          mkdir -p _site/blog _site/bench
          cp docs/blog/*.html _site/blog/
          cp docs/index.html _site/index.html
          cp -r docs/assets _site/assets
          cp bench/results.html bench/design.html bench/scenarios.html _site/bench/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
